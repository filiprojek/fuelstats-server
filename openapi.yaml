openapi: 3.0.3
info:
  title: Fuelstats API
  version: 1.0.0
servers:
  - url: http://localhost:3000
paths:
  '/':
    get:
      summary: Root endpoint
      responses:
        '200':
          description: OK
  '/api/v1/auth/signup':
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewUser'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  '/api/v1/auth/signin':
    post:
      summary: Authenticate a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthToken'
  '/api/v1/auth/signout':
    post:
      summary: Clear session cookies
      responses:
        '200':
          description: Signed out
  '/api/v1/auth/refresh':
    post:
      summary: Renew the current session token (sliding expiration)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Fresh token with the same lifetime
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthToken'
        '401':
          description: Not signed in or user no longer exists
  '/api/v1/auth/providers':
    get:
      summary: List configured single sign-on providers
      responses:
        '200':
          description: Providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OidcProvider'
  '/api/v1/auth/oidc/{provider}/start':
    get:
      summary: Start an OpenID Connect sign-in (browser navigation)
      parameters:
        - $ref: '#/components/parameters/Provider'
        - name: link
          in: query
          required: false
          description: Link token from POST /auth/oidc/{provider}/link
          schema:
            type: string
        - name: remember
          in: query
          required: false
          description: '"1" issues a remembered session (see signin)'
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the provider (or back to the app with an error)
  '/api/v1/auth/oidc/{provider}/callback':
    get:
      summary: OpenID Connect redirect target
      parameters:
        - $ref: '#/components/parameters/Provider'
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
      responses:
        '302':
          description: Redirect to <APP_HOST>/auth/callback#token=..., /settings#linked=... or #error=<code>
  '/api/v1/auth/oidc/{provider}/link':
    post:
      summary: Issue a short-lived token to link a provider to the current account
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Provider'
      responses:
        '200':
          description: Link token
          content:
            application/json:
              schema:
                type: object
                properties:
                  linkToken:
                    type: string
        '404':
          description: Unknown provider
  '/api/v1/user/me':
    get:
      summary: Get current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
  '/api/v1/user/password':
    put:
      summary: Set or change the account password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPassword]
              properties:
                currentPassword:
                  type: string
                  description: Required when the account already has a password
                newPassword:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: Password updated
        '400':
          description: weak_password
        '401':
          description: invalid_current_password
  '/api/v1/user/identities/{provider}':
    delete:
      summary: Unlink a single sign-on provider
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Provider'
      responses:
        '200':
          description: Provider unlinked
        '400':
          description: last_sign_in_method
        '404':
          description: Provider not linked
  '/api/v1/vehicles':
    get:
      summary: List vehicles
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Array of vehicles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Vehicle'
    post:
      summary: Create vehicle
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewVehicle'
      responses:
        '201':
          description: Created vehicle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
  '/api/v1/vehicles/{id}':
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get vehicle by ID
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Vehicle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
    put:
      summary: Update vehicle
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewVehicle'
      responses:
        '200':
          description: Updated vehicle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
    delete:
      summary: Delete vehicle
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Deleted
  '/api/v1/refuels':
    get:
      summary: List refuel records
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Array of refuels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Refuel'
    post:
      summary: Create refuel record
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewRefuel'
      responses:
        '201':
          description: Created refuel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refuel'
  '/api/v1/refuels/{id}':
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get refuel by ID
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Refuel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refuel'
    put:
      summary: Update refuel
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewRefuel'
      responses:
        '200':
          description: Updated refuel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refuel'
    delete:
      summary: Delete refuel
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Deleted

  '/api/v1/services':
    get:
      summary: List service records
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Array of service records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceRecord'
    post:
      summary: Create service record
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewServiceRecord'
      responses:
        '201':
          description: Created service record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRecord'
  '/api/v1/services/{id}':
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get service record by ID
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Service record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRecord'
    put:
      summary: Update service record
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewServiceRecord'
      responses:
        '200':
          description: Updated service record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRecord'
    delete:
      summary: Delete service record
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Deleted
components:
  parameters:
    Provider:
      name: provider
      in: path
      required: true
      description: Provider id from OIDC_PROVIDERS
      schema:
        type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        username:
          type: string
    CurrentUser:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            hasPassword:
              type: boolean
            identities:
              type: array
              items:
                type: object
                properties:
                  provider:
                    type: string
                  email:
                    type: string
                  linkedAt:
                    type: string
                    format: date-time
    OidcProvider:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    NewUser:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        username:
          type: string
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        remember:
          type: boolean
          description: Keep the session for AUTH_REMEMBER_DAYS (default 30) instead of 1 day
    AuthToken:
      type: object
      properties:
        token:
          type: string
        remember:
          type: boolean
    Vehicle:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        name:
          type: string
        registrationPlate:
          type: string
        fuelType:
          type: string
        note:
          type: string
        isDefault:
          type: boolean
        createdAt:
          type: string
          format: date-time
    NewVehicle:
      type: object
      required: [name, registrationPlate, fuelType]
      properties:
        name:
          type: string
        registrationPlate:
          type: string
        fuelType:
          type: string
        note:
          type: string
        isDefault:
          type: boolean
    Refuel:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        vehicleId:
          type: string
        fuelType:
          type: string
        note:
          type: string
        liters:
          type: number
        pricePerLiter:
          type: number
        totalPrice:
          type: number
        mileage:
          type: number
        createdAt:
          type: string
          format: date-time
    NewRefuel:
      type: object
      required: [vehicleId, fuelType, liters, pricePerLiter, totalPrice, mileage]
      properties:
        vehicleId:
          type: string
        fuelType:
          type: string
        note:
          type: string
        liters:
          type: number
        pricePerLiter:
          type: number
        totalPrice:
          type: number
        mileage:
          type: number
    ServiceRecord:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        vehicleId:
          type: string
        serviceType:
          type: string
        customType:
          type: string
        itemName:
          type: string
        cost:
          type: number
        mileage:
          type: number
        shop:
          type: string
        selfService:
          type: boolean
        note:
          type: string
        photos:
          type: array
          items:
            type: string
            format: uri
        date:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    NewServiceRecord:
      type: object
      required: [vehicleId, serviceType, cost, mileage, date]
      properties:
        vehicleId:
          type: string
        serviceType:
          type: string
        customType:
          type: string
        itemName:
          type: string
        cost:
          type: number
        mileage:
          type: number
        shop:
          type: string
        selfService:
          type: boolean
        note:
          type: string
        photos:
          type: array
          items:
            type: string
            format: byte
        date:
          type: string
          format: date-time

